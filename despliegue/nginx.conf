# nginx dentro del contenedor. Del HTTPS se encarga el proxy del VPS.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # El proxy del VPS manda las peticiones acá; no hace falta revelar la versión.
  server_tokens off;

  # Los tipos de siempre, más los que el mime.types de nginx no trae bien.
  include /etc/nginx/mime.types;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # La página y el service worker se revisan siempre, así una versión nueva llega enseguida.
  location = /index.html {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
  }
  location ~ ^/(sw\.js|registerSW\.js|workbox-.*\.js|manifest\.webmanifest)$ {
    types { application/javascript js; application/manifest+json webmanifest; }
    add_header Cache-Control "no-cache" always;
    add_header Service-Worker-Allowed "/" always;
    add_header X-Content-Type-Options nosniff always;
  }

  # JS, CSS y fuentes llevan un hash en el nombre: no cambian nunca.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
  }

  # Ilustraciones y audios se pueden reemplazar con el mismo nombre (por ejemplo
  # las narraciones regrabadas): caché de un día y se revalidan.
  location /img/ {
    add_header Cache-Control "public, max-age=86400, must-revalidate" always;
    add_header X-Content-Type-Options nosniff always;
  }
  location /audio/ {
    types { audio/mp4 m4a; }
    add_header Cache-Control "public, max-age=86400, must-revalidate" always;
    add_header X-Content-Type-Options nosniff always;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
